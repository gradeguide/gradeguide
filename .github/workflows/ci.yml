name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bazel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          # The pinned Knowledge Graph export is about 1 GB; keep it between runs.
          repository-cache: true
      - name: Build
        run: bazel build //...
      - name: Test
        run: bazel test //...

name: General feedback
description: Tell us what's working, what isn't, or what you'd like GradeGuide to do.
title: "Feedback: "
labels: [feedback]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping make GradeGuide better. This page is public, so please don't include your child's name or anything else personal.
  - type: textarea
    id: feedback
    attributes:
      label: What would you like to tell us?
    validations:
      required: true
  - type: dropdown
    id: who
    attributes:
      label: Who are you?
      options:
        - A parent or carer
        - A teacher
        - Someone else
    validations:
      required: false
  - type: input
    id: page
    attributes:
      label: Page you were on
      description: Filled in for you when you came from the site.
